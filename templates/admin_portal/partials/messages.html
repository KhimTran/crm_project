{% if messages %}<div class="portal-messages" aria-live="polite">
  {% for message in messages %}<div class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %} mb-2" role="status">{{ message }}</div>{% endfor %}
</div>{% endif %}
