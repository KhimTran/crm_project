{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · CRM Admin Portal</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/admin_portal.css' %}" rel="stylesheet">
</head>
<body class="portal-login-page">
  <main class="portal-login-card">
    <p class="portal-eyebrow">CRM ADMIN PORTAL</p>
    <h1 class="h3 mb-1">Login</h1>
    <p class="text-muted mb-4">Sign in to manage the CRM.</p>
    {% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
    <form method="post" action="{% url 'login' %}" novalidate>
      {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label class="form-label" for="id_email">Email</label>{{ form.email }}{{ form.email.errors }}</div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label>{{ form.password }}{{ form.password.errors }}</div>
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
  </main>
  <script src="{% static 'js/admin_portal.js' %}"></script>
</body>
</html>
