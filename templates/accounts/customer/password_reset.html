{% extends "layouts/base_customer.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<section class="customer-auth-card form-panel" aria-labelledby="reset-title">
  <p class="eyebrow">Khôi phục tài khoản</p>
  <h1 id="reset-title">Quên mật khẩu</h1>
  <p>Nhập email để yêu cầu liên kết đặt lại mật khẩu.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="shop-button" type="submit">Yêu cầu đặt lại mật khẩu</button>
  </form>
  <div class="auth-links"><a href="{% url 'customer_auth:login' %}">Về trang đăng nhập</a></div>
</section>
{% endblock %}
