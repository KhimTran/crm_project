{% extends "layouts/base_customer.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>Quên mật khẩu</h1>
  <p>Nhập email để yêu cầu liên kết đặt lại mật khẩu.</p>
  <form method="post">{% csrf_token %}{{ form.as_div }}<button class="btn btn-success" type="submit">Yêu cầu đặt lại mật khẩu</button></form>
</section>
{% endblock %}
