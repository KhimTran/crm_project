{% extends "layouts/base_customer.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="customer-auth-layout" aria-labelledby="login-title">
  <div class="customer-auth-card form-panel">
    <h1 id="login-title">Đăng nhập</h1>
    <p>Đăng nhập để quản lý hồ sơ và tài khoản của bạn.</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {{ form.as_div }}
      <button class="shop-button" type="submit">Đăng nhập</button>
    </form>
    <div class="auth-links">
      <a href="{% url 'customer_auth:password_reset' %}">Quên mật khẩu?</a>
      <p>Chưa có tài khoản? <a href="{% url 'customer_auth:register' %}">Đăng ký khách hàng</a></p>
    </div>
  </div>
</section>
{% endblock %}
