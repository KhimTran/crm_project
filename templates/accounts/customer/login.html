{% extends "layouts/base_customer.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>Đăng nhập</h1>
  <p>Dành cho khách hàng và người dùng CRM.</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {{ form.as_div }}
    <button class="btn btn-success" type="submit">Đăng nhập</button>
  </form>
  <p><a href="{% url 'customer_auth:password_reset' %}">Quên mật khẩu?</a> · <a href="{% url 'customer_auth:register' %}">Đăng ký khách hàng</a></p>
</section>
{% endblock %}
