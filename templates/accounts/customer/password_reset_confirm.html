{% extends "layouts/base_customer.html" %}
{% block title %}Đặt lại mật khẩu{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>Đặt lại mật khẩu</h1>
  {% if validlink %}
    <form method="post">{% csrf_token %}{{ form.as_div }}<button class="btn btn-success" type="submit">Lưu mật khẩu mới</button></form>
  {% else %}
    <p>Liên kết đã hết hạn hoặc không còn hợp lệ.</p>
    <a href="{% url 'customer_auth:password_reset' %}">Yêu cầu liên kết mới</a>
  {% endif %}
</section>
{% endblock %}
