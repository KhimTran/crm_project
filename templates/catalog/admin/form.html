{% extends 'manager/base.html' %}
{% block title %}{{ title }} · CRM Manager Portal{% endblock %}

{% block content %}
<div class="portal-section-intro"><a href="{% if back_url %}{{ back_url }}{% else %}{% url 'catalog_admin:product_list' %}{% endif %}">Back to list</a></div>
<section class="portal-panel"><form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{{ form.as_p }}<button class="btn btn-primary" type="submit">Save</button></form></section>
{% endblock %}
