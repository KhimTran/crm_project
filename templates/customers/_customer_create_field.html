{% load portal_text %}
<div class="customer-create-field">
  <label for="{{ field.id_for_label }}">{{ field.label }}:{% if field.field.required %} <span class="customer-required" aria-hidden="true">*</span>{% endif %}</label>
  {% if field.name == 'password' %}
    <div class="customer-password-control">
      {{ field }}
      <button type="button" class="{% if in_admin_portal %}btn btn-outline-secondary{% else %}crm-btn crm-btn-secondary{% endif %}" id="customer-password-toggle" aria-controls="{{ field.id_for_label }}" aria-pressed="false" data-show="{% t 'Hiện mật khẩu' 'Show password' %}" data-hide="{% t 'Ẩn mật khẩu' 'Hide password' %}" hidden>{% t "Hiện mật khẩu" "Show password" %}</button>
    </div>
  {% else %}{{ field }}{% endif %}
  {% if field.help_text %}<div class="customer-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  <ul class="errorlist crm-errorlist" id="{{ field.auto_id }}_error" data-field-error="{{ field.name }}" {% if not field.errors %}hidden{% endif %}>{% for e in field.errors %}<li>{% t e %}</li>{% endfor %}</ul>
</div>
